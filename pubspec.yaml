name: skillswap_app
description: "A peer-to-peer skill exchange platform for university students."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0
  firebase_storage: ^12.0.0
  google_sign_in: ^6.2.0

  # State Management
  provider: ^6.1.0

  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_cloud_firestore: ^3.0.0
  firebase_auth_mocks: ^0.14.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true